<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IdleTap</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #f0f0f0;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #ffcc00; margin-bottom: 10px; }
    .stats { display: flex; justify-content: center; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
    .card {
      background: #2a2a3d; padding: 15px 20px; border-radius: 12px;
      min-width: 120px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    button {
      padding: 12px 20px; margin: 8px; font-size: 16px;
      border-radius: 8px; border: none; cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { transform: scale(1.05); }
    #tapBtn { background: #ffcc00; color: #000; }
    #upgradeBtn { background: #00ccff; color: #000; }
    #prestigeBtn { background: #ff66cc; color: #000; }
    #supporterBadge { display:none; color: #00ff66; font-weight: bold; margin: 15px 0; font-size: 18px; }
    #donatePopup {
      display: none; position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.8); align-items: center; justify-content: center; display: flex; z-index: 1000;
    }
    #donatePopup div {
      background: #2a2a3d; padding: 20px; border-radius: 12px;
      max-width: 350px; text-align: center; color: #f0f0f0;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }
    #donatePopup a {
      display: inline-block; margin: 10px 0; padding: 10px 15px;
      background: #ffcc00; color: #000; font-weight: bold; text-decoration: none; border-radius: 8px;
    }
    #donatePopup button {
      background: #00ccff; color: #000; margin-top: 10px; padding: 8px 15px; border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>IdleTap</h1>

  <p id="supporterBadge">🏅 Supporter Bonus Active!</p>

  <div class="stats">
    <div class="card">Points: <span id="points">0</span></div>
    <div class="card">Income/sec: <span id="income">1</span></div>
    <div class="card">Prestige: <span id="prestige">0</span>x</div>
  </div>

  <div>
    <button id="tapBtn">TAP</button>
    <button id="upgradeBtn">Buy +5/sec (50)</button>
    <button id="prestigeBtn">Prestige (1000)</button>
  </div>

  <hr style="margin:20px 0; border-color:#444;">

  <p>❤️ Support the developer</p>
  <a href="https://www.buymeacoffee.com/mariomario" target="_blank">☕ Buy me a coffee</a>

  <!-- DONATE POPUP -->
  <div id="donatePopup">
    <div>
      <h3>❤️ Thanks for playing!</h3>
      <p>You just prestiged 🎉<br>
      IdleTap is made by a solo developer.<br>
      Your support helps add new features.</p>
      <a href="https://www.buymeacoffee.com/mariomario" target="_blank">☕ Buy me a coffee</a>
      <br>
      <button onclick="closeDonate()">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
